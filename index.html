<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glowline</title>
    <!-- Loading screen styles are inline so it shows before anything else loads. -->
    <style>
      #loader{position:fixed;inset:0;z-index:100;background:#09090C;display:grid;place-items:center;color:#F4F1EC;opacity:1;visibility:visible;transition:opacity .6s ease,visibility 0s linear .6s}
      #loader.done{opacity:0;visibility:hidden}
      .ld-stack{display:flex;flex-direction:column;align-items:center}
      .ld-mark{position:relative;width:clamp(64px,9vmin,96px);aspect-ratio:1}
      .ld-mark svg{position:relative;display:block;width:100%;height:100%;overflow:visible}
      .ld-glow{position:absolute;left:50%;top:41%;width:260%;aspect-ratio:1;margin:-130% 0 0 -130%;border-radius:50%;background:radial-gradient(closest-side,rgba(244,241,236,.16),rgba(244,241,236,.05) 55%,rgba(244,241,236,0));opacity:0;will-change:transform,opacity;animation:ld-in 1s ease .2s both,ld-breathe 2.4s ease-in-out 1.2s infinite}
      .ld-ring{stroke-dasharray:100 100;animation:ld-draw .9s cubic-bezier(.65,0,.35,1) both}
      .ld-line{transform-box:fill-box;transform-origin:center;animation:ld-grow .75s cubic-bezier(.33,0,.2,1) .25s both,ld-dim .5s ease 1.1s forwards}
      .ld-sing{stroke-dasharray:100 102;stroke-dashoffset:101;opacity:0;animation:ld-sing 2.4s cubic-bezier(.45,0,.4,1) 1.2s infinite}
      .ld-name{margin-top:clamp(18px,2.6vmin,28px);font:italic 400 clamp(28px,4.2vmin,44px)/1 "Instrument Serif",Georgia,serif;letter-spacing:.01em;animation:ld-up .7s ease-out .45s both}
      .ld-status{margin-top:clamp(12px,1.6vmin,18px);font:500 clamp(10px,1.2vmin,12px)/1 "Geist Mono",ui-monospace,Consolas,monospace;letter-spacing:.24em;text-transform:uppercase;opacity:.45;animation:ld-fade .6s ease .8s both,ld-hush 2.4s ease-in-out 1.4s infinite}
      @keyframes ld-draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
      @keyframes ld-grow{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
      @keyframes ld-dim{to{opacity:.32}}
      @keyframes ld-sing{0%{stroke-dashoffset:101;opacity:1}58%{stroke-dashoffset:0;opacity:1}75%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
      @keyframes ld-in{from{opacity:0;transform:scale(.85)}to{opacity:.7;transform:scale(1)}}
      @keyframes ld-breathe{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}
      @keyframes ld-up{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
      @keyframes ld-fade{from{opacity:0}to{opacity:.45}}
      @keyframes ld-hush{0%,100%{opacity:.45}50%{opacity:.28}}
      @media (prefers-reduced-motion:reduce){
        #loader *{animation:none!important}
        .ld-glow{opacity:.8}.ld-ring{stroke-dashoffset:0}.ld-line{opacity:1}.ld-sing{opacity:0}
      }
    </style>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="loader" role="status" aria-label="Loading Glowline">
      <div class="ld-stack">
        <div class="ld-mark" aria-hidden="true">
          <div class="ld-glow"></div>
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round">
            <circle class="ld-ring" cx="32" cy="26" r="14.5" pathLength="100" transform="rotate(-90 32 26)" />
            <path class="ld-line" d="M13 51.5H51" />
            <path class="ld-sing" d="M13 51.5H51" pathLength="100" />
          </svg>
        </div>
        <div class="ld-name">Glowline</div>
        <div class="ld-status">Getting ready</div>
      </div>
    </div>

    <div id="app" class="app" data-mode="loading" data-layout="cinematic" data-bg="artwork">
      <!-- 1. background: artwork layers are added by render/background.ts;
              the gradient is used by the "Colour gradient" background style -->
      <div class="bg" id="bg" aria-hidden="true">
        <div class="bg-gradient"><i></i><i></i><i></i></div>
        <div class="bg-dim"></div>
      </div>
      <!-- 2. vignette -->
      <div class="vignette" aria-hidden="true"></div>
      <!-- 3. bottom shade, only while the player bar is visible -->
      <div class="shade" aria-hidden="true"></div>
      <!-- sharp artwork for the "Art on the side" background style -->
      <img class="side-art empty" id="side-art" alt="" />

      <!-- 4. lyrics stage -->
      <main class="stage" id="stage" aria-live="off"></main>

      <section class="plain" id="plain" aria-label="Lyrics (unsynced)">
        <div class="plain-inner" id="plain-inner"></div>
      </section>

      <section class="card" id="card">
        <img class="card-art" id="card-art" alt="" />
        <h1 class="card-title" id="card-title"></h1>
        <p class="card-artist" id="card-artist"></p>
        <p class="card-note mono">
          <svg class="ld-mini" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
            <circle cx="10" cy="8" r="5.5" opacity=".25" />
            <circle class="ld-mini-arc" cx="10" cy="8" r="5.5" pathLength="100" />
            <path d="M3.5 17.25H16.5" opacity=".25" />
            <path class="ld-mini-sing" d="M3.5 17.25H16.5" pathLength="100" />
          </svg>
          <span id="card-note"></span>
        </p>
        <div class="dots card-dots" id="card-dots" aria-hidden="true"><i></i><i></i><i></i></div>
      </section>

      <section class="idle" id="idle" aria-label="Clock">
        <div class="idle-clock" id="idle-clock">--:--</div>
        <div class="idle-date mono" id="idle-date"></div>
      </section>

      <span class="unsynced mono" id="unsynced">unsynced</span>

      <!-- 5. player bar -->
      <footer class="bar chrome" id="bar">
        <img class="bar-thumb" id="bar-thumb" alt="" />
        <div class="bar-meta">
          <div class="bar-title" id="bar-title"></div>
          <div class="bar-artist" id="bar-artist"></div>
        </div>
        <div class="bar-controls">
          <button class="btn" id="btn-prev" title="Previous (←)" aria-label="Previous track">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9.5 12z" /></svg>
          </button>
          <button class="btn btn-play" id="btn-play" title="Play / pause (Space)" aria-label="Play or pause">
            <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
            <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" /></svg>
          </button>
          <button class="btn" id="btn-next" title="Next (→)" aria-label="Next track">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z" /></svg>
          </button>
        </div>
        <div class="bar-progress">
          <span class="mono bar-time" id="bar-elapsed">0:00</span>
          <div class="bar-track"><div class="bar-fill" id="bar-fill"></div></div>
          <span class="mono bar-time" id="bar-total">0:00</span>
        </div>
        <button class="btn" id="btn-settings" title="Settings (,)" aria-label="Open settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z" />
          </svg>
        </button>
      </footer>

      <!-- 6. top-left label -->
      <header class="label chrome">
        <svg class="ring" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" aria-hidden="true">
          <circle cx="32" cy="26" r="14.5" />
          <path d="M13 51.5H51" />
        </svg>
        <span class="mono" id="label-text">LYRICS</span>
      </header>

      <!-- 7. top-right window controls -->
      <div class="winctl chrome">
        <button class="update-pill mono" id="btn-update" hidden title="Restart Glowline to install the update">
          Update ready · Restart
        </button>
        <button class="btn" id="btn-mode" title="Window (F)" aria-label="Switch between full screen and window">
          <svg class="i-shrink" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z" />
          </svg>
          <svg class="i-grow" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
          </svg>
        </button>
        <button class="btn btn-close" id="btn-close" title="Close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
          </svg>
        </button>
      </div>

      <div class="toast mono" id="toast" role="status"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
